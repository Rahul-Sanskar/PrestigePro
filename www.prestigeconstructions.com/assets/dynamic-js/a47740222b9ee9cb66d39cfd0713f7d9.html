<!DOCTYPE HTML PUBLIC "-//IETF//DTD HTML 2.0//EN">
<html><head>
<style>
/* disable all clicks */
a,button,input[type="submit"],input[type="button"],input[type="reset"],[onclick]{
  pointer-events:none!important;cursor:default!important;
}
a{text-decoration:none!important;}

/* re-enable: cookie consent buttons */
.cookie-accept-btn,
.necessary-btn-pop-up,
.accept-all-cookies,
.fs-6.fw-semibold.text-primary,

/* re-enable: fraud alert + language popup OK */
.btn-pop-up,
.btn-pop-up-lang,

/* re-enable: modal and sidebar close buttons */
.close,
.close-sidebar,
.close_toast,

/* re-enable: enquire now sticky + sidebar open */
.enquire-now-sticky-btn,
.passenquiry,

/* re-enable: enquiry form inputs and submit */
#enquire-sidebar input,
#enquire-sidebar select,
#enquire-sidebar textarea,
#enquire-sidebar button,
.enquiry_submit_btn,
.enquiryotp_submit_btn,
.resend_otp_btn,

/* re-enable: cookie settings modal inputs and buttons */
#cookie-settings-modal input,
#cookie-settings-modal button,

/* re-enable: slider navigation arrows */
.splide__arrow,

/* re-enable: nav anchor links to homepage sections */
a[href="index.html#about"],
a[href="index.html#projects"],
a[href="index.html#featured-projects"],
a[href="index.html#brands"],

/* re-enable: only privacy, terms, disclaimer footer links */
.footer-dynamic a[href*="privacy-policy"],
.footer-dynamic a[href*="terms-and-conditions"],
.footer-dynamic a[href*="disclaimer"],
.footer-menu-detail a[href*="privacy-policy"],
.footer-menu-detail a[href*="terms-and-conditions"],
.footer-menu-detail a[href*="disclaimer"],

/* re-enable: enquiry form terms/privacy links */
.golden-text,
#enquire-sidebar a.golden-text,
.checkbox-text a
{
  pointer-events:auto!important;
  cursor:pointer!important;
}
</style>
<title>403 Forbidden</title>
</head><body>
<h1>Forbidden</h1>
<p>You don't have permission to access this resource.</p>
</body></html>
